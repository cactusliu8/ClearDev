components:
  schemas:
    APIError:
      properties:
        code:
          type: string
        details:
          additionalProperties: {}
          type: object
        error:
          type: string
        message:
          type: string
        requestId:
          type: string
      required:
      - error
      - code
      - message
      type: object
    AcknowledgeSessionInterfaceTransitionNoticeResponse:
      properties:
        ok:
          type: boolean
        sessionId:
          type: string
        transition:
          $ref: '#/components/schemas/SessionInterfaceTransition'
      required:
      - ok
      - sessionId
      - transition
      type: object
    ActivateConversationBranchResponse:
      properties:
        activeBranchId:
          type: string
      required:
      - activeBranchId
      type: object
    AddProjectInput:
      properties:
        asWorkspace:
          type: boolean
        config:
          $ref: '#/components/schemas/ProjectConfig'
        name:
          type:
          - "null"
          - string
        path:
          type: string
        projectId:
          type:
          - "null"
          - string
      required:
      - path
      type: object
    AgentConfig:
      properties:
        mode:
          type: string
        model:
          type: string
        permissions:
          type: string
      type: object
    AgentInfo:
      properties:
        authStatus:
          description: Advisory local auth probe result. authorized means a recent
            local probe passed; spawn remains the authoritative validation point.
          enum:
          - authorized
          - unauthorized
          - unknown
          type: string
        id:
          type: string
        label:
          type: string
        lastUsedAt:
          description: Creation time of the newest retained session currently attributed
            to this agent.
          format: date-time
          type:
          - "null"
          - string
        usageCount:
          description: Number of retained sessions currently attributed to this agent.
          type: integer
      required:
      - id
      - label
      type: object
    AgentModelInfo:
      properties:
        efforts:
          items:
            type: string
          type: array
        id:
          type: string
        isDefault:
          type: boolean
        label:
          type: string
        provider:
          type: string
      required:
      - id
      - label
      type: object
    AgentModelsResponse:
      properties:
        agentId:
          type: string
        allowCustom:
          type: boolean
        binaryVersion:
          type: string
        fetchedAt:
          format: date-time
          type: string
        models:
          items:
            $ref: '#/components/schemas/AgentModelInfo'
          type: array
        refreshRecommended:
          type: boolean
        selectionMode:
          enum:
          - catalog
          - text
          - mode
          type: string
        source:
          type: string
        stale:
          type: boolean
        validatedAt:
          format: date-time
          type: string
        warning:
          type: string
      required:
      - agentId
      - selectionMode
      - models
      - allowCustom
      - source
      - fetchedAt
      - stale
      type: object
    AgentSwitch:
      properties:
        agentHandoffStatus:
          enum:
          - not_attempted
          - requested
          - received
          - unavailable
          - timed_out
          - failed
          - rejected
          type: string
        errorCode:
          enum:
          - daemon_restart_pre_stop
          - daemon_restart_post_stop
          - daemon_restart_unrecoverable_target
          - daemon_restart_before_delivery
          - delivery_unconfirmed
          - source_session_terminated
          - source_stop_unconfirmed
          - target_binary_missing
          - target_agent_unauthorized
          - target_start_unconfirmed
          - source_restore_unconfirmed
          - request_cancelled
          - source_blocked
          - failed_pre_stop
          - failed_post_stop
          - target_ready_failed
          - delivery_failed
          - switch_failed
          type: string
        fromHarness:
          type: string
        id:
          type: string
        requestedAt:
          format: date-time
          type: string
        semanticHandoffIncluded:
          type: boolean
        sessionId:
          type: string
        sourceTranscriptStatus:
          enum:
          - not_attempted
          - available
          - unavailable
          type: string
        state:
          enum:
          - preparing_handoff
          - stopping_source
          - source_stopped
          - starting_target
          - target_ready
          - delivering_context
          - completed
          - failed
          type: string
        targetHarness:
          type: string
        targetStartMode:
          enum:
          - fresh
          - resumed
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - sessionId
      - fromHarness
      - targetHarness
      - state
      - agentHandoffStatus
      - semanticHandoffIncluded
      - requestedAt
      - updatedAt
      type: object
    AgentSwitchResponse:
      properties:
        switch:
          $ref: '#/components/schemas/AgentSwitch'
      required:
      - switch
      type: object
    AnthropicUsageDetailsResponse:
      properties:
        anthropicCacheCreation1hInputTokens:
          minimum: 0
          type:
          - "null"
          - integer
        anthropicCacheCreation5mInputTokens:
          minimum: 0
          type:
          - "null"
          - integer
        anthropicCacheCreationInputTokens:
          minimum: 0
          type:
          - "null"
          - integer
        anthropicDirectUncachedInputTokens:
          minimum: 0
          type:
          - "null"
          - integer
      required:
      - anthropicDirectUncachedInputTokens
      - anthropicCacheCreationInputTokens
      - anthropicCacheCreation5mInputTokens
      - anthropicCacheCreation1hInputTokens
      type: object
    AttachmentInput:
      properties:
        data:
          type: string
        mimeType:
          type: string
      required:
      - data
      type: object
    BrowserCommandRequest:
      properties:
        action:
          type: string
        args:
          additionalProperties: {}
          type: object
        sessionId:
          type: string
      required:
      - sessionId
      - action
      type: object
    BrowserCommandResponse:
      properties:
        action:
          type: string
        requestId:
          type: string
        result: {}
        sessionId:
          type: string
      required:
      - requestId
      - sessionId
      - action
      - result
      type: object
    BrowserStatusResponse:
      properties:
        connected:
          type: boolean
        connectedAt:
          format: date-time
          type: string
        sessionId:
          type: string
        transport:
          type: string
      required:
      - sessionId
      - connected
      - transport
      type: object
    CancelReviewResponse:
      properties:
        reviewerHandleId:
          type: string
        reviews:
          items:
            $ref: '#/components/schemas/PRReviewState'
          type: array
      required:
      - reviewerHandleId
      - reviews
      type: object
    CancelSessionInterfaceTransitionResponse:
      properties:
        ok:
          type: boolean
        sessionId:
          type: string
      required:
      - ok
      - sessionId
      type: object
    ClaimPRRequest:
      properties:
        allowTakeover:
          type:
          - "null"
          - boolean
        pr:
          minLength: 1
          type: string
      required:
      - pr
      type: object
    ClaimPRResponse:
      properties:
        branchChanged:
          type: boolean
        ok:
          type: boolean
        prs:
          items:
            $ref: '#/components/schemas/SessionPRFacts'
