<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">ClearDev 可信控制结构</title>
  <desc id="desc">Agent 输出先进入 ClearDev 控制层，由确定性规则、权限边界、候选冻结、隔离检查、独立评审和人类授权形成可信事实，再从持久化事实派生项目状态。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#111827; }
      .subtitle { font: 400 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#64748b; }
      .h { font: 700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1f2937; }
      .sh { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#334155; }
      .body { font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#475569; }
      .note { font: 600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#334155; }
      .agentBox { fill:#f8fafc; stroke:#94a3b8; stroke-width:2; rx:10; }
      .controlBox { fill:#ffffff; stroke:#2563eb; stroke-width:2.3; rx:12; }
      .factBox { fill:#ffffff; stroke:#16a34a; stroke-width:2.3; rx:12; }
      .outputBox { fill:#f8fafc; stroke:#64748b; stroke-width:2; rx:10; }
      .band { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; rx:12; }
      .flow { fill:none; stroke:#475569; stroke-width:2.6; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#94a3b8; stroke-width:2; stroke-dasharray:8 7; marker-end:url(#arrow); }
      .divider { stroke:#e2e8f0; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#ffffff"/>

  <text x="750" y="58" text-anchor="middle" class="title">ClearDev 可信控制结构</text>
  <text x="750" y="94" text-anchor="middle" class="subtitle">Agent 可以提出计划、代码和评审结论，但不能仅凭自己的声明推进项目状态</text>

  <!-- Untrusted input layer -->
  <rect x="70" y="135" width="1360" height="145" class="band"/>
  <text x="95" y="168" class="h">Agent 输出 / 外部输入</text>
  <text x="95" y="197" class="body">这些内容先视为“待验证输入”，不会直接成为完成事实。</text>

  <rect x="330" y="205" width="190" height="50" class="agentBox"/>
  <text x="425" y="236" text-anchor="middle" class="sh">Planner：计划与任务</text>

  <rect x="655" y="205" width="190" height="50" class="agentBox"/>
  <text x="750" y="236" text-anchor="middle" class="sh">Builder：代码与结果</text>

  <rect x="980" y="205" width="190" height="50" class="agentBox"/>
  <text x="1075" y="236" text-anchor="middle" class="sh">Reviewer：评审结论</text>

  <!-- Trusted control layer -->
  <text x="750" y="330" text-anchor="middle" class="h">ClearDev 控制层（可信边界）</text>

  <rect x="70" y="365" width="245" height="190" class="controlBox"/>
  <text x="193" y="402" text-anchor="middle" class="sh">确定性规则</text>
  <line x1="95" y1="420" x2="290" y2="420" class="divider"/>
  <text x="95" y="452" class="body">• 需求版本与任务状态规则</text>
  <text x="95" y="484" class="body">• 状态迁移条件</text>
  <text x="95" y="516" class="body">• 超限 / 缺证据时拒绝推进</text>

  <rect x="340" y="365" width="245" height="190" class="controlBox"/>
  <text x="463" y="402" text-anchor="middle" class="sh">权限边界</text>
  <line x1="365" y1="420" x2="560" y2="420" class="divider"/>
  <text x="365" y="452" class="body">• Write / Generated 路径</text>
  <text x="365" y="484" class="body">• Shared 需批准路径</text>
  <text x="365" y="516" class="body">• Forbidden 路径</text>

  <rect x="610" y="365" width="245" height="190" class="controlBox"/>
  <text x="733" y="402" text-anchor="middle" class="sh">候选冻结</text>
  <line x1="635" y1="420" x2="830" y2="420" class="divider"/>
  <text x="635" y="452" class="body">• 绑定精确 Git commit SHA</text>
  <text x="635" y="484" class="body">• 校验实际修改范围</text>
  <text x="635" y="516" class="body">• 已冻结候选不可偷换</text>

  <rect x="880" y="365" width="245" height="190" class="controlBox"/>
  <text x="1003" y="402" text-anchor="middle" class="sh">隔离检查</text>
  <line x1="905" y1="420" x2="1100" y2="420" class="divider"/>
  <text x="905" y="452" class="body">• 只读物化候选源码</text>
  <text x="905" y="484" class="body">• 固定检查环境 / 镜像</text>
  <text x="905" y="516" class="body">• 记录结果与输出摘要</text>

  <rect x="1150" y="365" width="280" height="190" class="controlBox"/>
  <text x="1290" y="402" text-anchor="middle" class="sh">独立评审与人类授权</text>
  <line x1="1175" y1="420" x2="1405" y2="420" class="divider"/>
  <text x="1175" y="452" class="body">• Reviewer 绑定同一候选</text>
  <text x="1175" y="484" class="body">• 关键例外需要显式授权</text>
  <text x="1175" y="516" class="body">• 缺少权限时 fail closed</text>

  <!-- Arrows from agents to control -->
  <path d="M425 255 V330 H193 V365" class="dash"/>
  <path d="M750 255 V330 H733 V365" class="dash"/>
  <path d="M1075 255 V330 H1290 V365" class="dash"/>

  <!-- Durable facts -->
  <path d="M750 565 V615" class="flow"/>
  <rect x="175" y="625" width="1150" height="150" class="factBox"/>
  <text x="750" y="663" text-anchor="middle" class="h">持久化可信事实</text>
  <line x1="210" y1="680" x2="1290" y2="680" class="divider"/>
  <text x="245" y="714" class="body">需求版本</text>
  <text x="430" y="714" class="body">权限版本</text>
  <text x="605" y="714" class="body">候选 commit</text>
  <text x="790" y="714" class="body">检查结果</text>
  <text x="955" y="714" class="body">评审记录</text>
  <text x="1120" y="714" class="body">人类决策</text>
  <text x="750" y="751" text-anchor="middle" class="body">事实以追加记录和窄范围 CAS 更新为主；旧检查、旧评审和历史事件不会被 Agent 重写。</text>

  <!-- Derived output -->
  <path d="M750 775 V810" class="flow"/>
  <rect x="435" y="815" width="630" height="58" class="outputBox"/>
  <text x="750" y="850" text-anchor="middle" class="note">派生状态 / Trusted Progress：只有满足权限、候选、检查和评审门槛后才继续推进</text>
</svg>